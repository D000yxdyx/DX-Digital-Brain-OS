services:
  postgres:
    # PostgreSQL 18 has a new PGDATA layout; mount the parent path deliberately.
    image: postgres:18.6
    env_file: .env
    ports:
      - "127.0.0.1:${DX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
